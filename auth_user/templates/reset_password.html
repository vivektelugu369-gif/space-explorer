{% extends 'main.html' %}

{% block css %}
<style>
.reset-container {
    min-height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
}

.reset-card {
    width: 100%;
    max-width: 430px;
    padding: 35px;
    background: rgba(8, 13, 28, 0.88);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(250, 204, 21, 0.4);
    border-radius: 18px;
    box-sizing: border-box;
}

.reset-card h1 {
    color: #facc15;
    text-align: center;
    font-size: 26px;
    margin-bottom: 10px;
}

.reset-card p {
    color: #cbd5e1;
    text-align: center;
    margin-bottom: 28px;
    font-size: 14px;
}

.reset-field {
    margin-bottom: 20px;
}

.reset-field label {
    display: block;
    color: white;
    margin-bottom: 8px;
    font-size: 14px;
}

.reset-field input {
    width: 100%;
    padding: 12px;
    background: #101a30;
    border: 1px solid #475569;
    border-radius: 8px;
    color: white;
    box-sizing: border-box;
    outline: none;
}

.reset-field input:focus {
    border-color: #facc15;
    box-shadow: 0 0 8px rgba(250, 204, 21, 0.2);
}

.reset-field input:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.reset-card button {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    background: #facc15;
    color: #111827;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.reset-card button:hover {
    background: #fde047;
    transform: translateY(-2px);
}

@media (max-width: 480px) {
    .reset-card {
        padding: 25px 18px;
    }

    .reset-card h1 {
        font-size: 22px;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="reset-container">
    <div class="reset-card">    <h1>Reset Password</h1>
    <p>Secure your Space Explorer account.</p>

    <form action="" method="POST">
        {% csrf_token %}

        <div class="reset-field">
            <label>Username</label>
            <input type="text"
                   value="{{ request.user.username }}"
                   disabled>
        </div>

        {% if new %}

            <div class="reset-field">
                <label>Enter New Password</label>
                <input type="password"
                       name="npasw"
                       placeholder="Enter new password"
                       required>
            </div>

            <div class="reset-field">
                <label>Confirm New Password</label>
                <input type="password"
                       name="ncpasw"
                       placeholder="Confirm new password"
                       required>
            </div>

        {% else %}

            <div class="reset-field">
                <label>Enter Old Password</label>
                <input type="password"
                       name="opasw"
                       placeholder="Enter old password"
                       required>
            </div>

        {% endif %}

        <button type="submit">RESET PASSWORD</button>

    </form>
</div>

</div>{% endblock %}
