{% extends 'main.html' %}

{% block css %}
<style>
.update-container {
    min-height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
    box-sizing: border-box;
}

.update-card {
    width: 100%;
    max-width: 480px;
    padding: 35px;
    background: rgba(8, 13, 28, 0.9);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(250, 204, 21, 0.4);
    border-radius: 20px;
    box-sizing: border-box;
}

.update-card h1 {
    color: #facc15;
    text-align: center;
    font-size: 26px;
    margin-bottom: 28px;
}

.update-field {
    margin-bottom: 19px;
}

.update-field label {
    display: block;
    color: #e2e8f0;
    font-size: 14px;
    margin-bottom: 8px;
}

.update-field input {
    width: 100%;
    padding: 12px;
    background: #101a30;
    border: 1px solid #475569;
    border-radius: 8px;
    color: white;
    box-sizing: border-box;
    outline: none;
}

.update-field input:focus {
    border-color: #facc15;
    box-shadow: 0 0 8px rgba(250, 204, 21, 0.2);
}

.update-field input[type="file"] {
    padding: 10px;
    font-size: 13px;
}

.update-card button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    background: #facc15;
    color: #111827;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.update-card button:hover {
    background: #fde047;
    transform: translateY(-2px);
}

@media (max-width: 480px) {
    .update-card {
        padding: 25px 18px;
    }

    .update-card h1 {
        font-size: 22px;
    }
}
</style>
{% endblock %}
{% block content %}
<div class="update-container">
    <div class="update-card">    <h1> Update Explorer Profile</h1>

    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="update-field">
            <label>First Name</label>
            <input type="text" name="fname"
                   value="{{ request.user.first_name }}">
        </div>

        <div class="update-field">
            <label>Last Name</label>
            <input type="text" name="lname"
                   value="{{ request.user.last_name }}">
        </div>

        <div class="update-field">
            <label>Username</label>
            <input type="text" name="uname"
                   value="{{ request.user.username }}">
        </div>

        <div class="update-field">
            <label>Email ID</label>
            <input type="email" name="email"
                   value="{{ request.user.email }}">
        </div>

        <div class="update-field">
            <label>Phone Number</label>
            <input type="tel" name="phone"
                   value="{{ profile.phone }}">
        </div>

        <div class="update-field">
            <label>Update Profile Picture</label>
            <input type="file" name="image"
                   id="image" accept="image/*">
        </div>

        <button type="submit">SAVE CHANGES</button>

    </form>

</div>

</div>
{% endblock %}
