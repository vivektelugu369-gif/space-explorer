{% extends 'main.html' %}

{% block css %}
<style>
.forgot-container {
    min-height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
}

.forgot-card {
    width: 100%;
    max-width: 430px;
    padding: 35px;
    background: rgba(8, 13, 28, 0.88);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(250, 204, 21, 0.4);
    border-radius: 18px;
    box-sizing: border-box;
}

.forgot-card h1 {
    color: #facc15;
    text-align: center;
    font-size: 26px;
    margin-bottom: 12px;
}

.forgot-card p {
    color: #cbd5e1;
    text-align: center;
    font-size: 14px;
    margin-bottom: 28px;
    line-height: 1.6;
}

.forgot-field {
    margin-bottom: 20px;
}

.forgot-field label {
    display: block;
    color: white;
    margin-bottom: 8px;
    font-size: 14px;
}

.forgot-field input {
    width: 100%;
    padding: 12px;
    background: #101a30;
    border: 1px solid #475569;
    border-radius: 8px;
    color: white;
    box-sizing: border-box;
    outline: none;
}

.forgot-field input:focus {
    border-color: #facc15;
}

.forgot-field input:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.forgot-card button {
    width: 100%;
    padding: 13px;
    background: #facc15;
    color: #111827;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.forgot-card button:hover {
    background: #fde047;
    transform: translateY(-2px);
}

.forgot-login {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #facc15;
    text-decoration: none;
    font-size: 14px;
}

.forgot-login:hover {
    text-decoration: underline;
}

@media (max-width: 480px) {
    .forgot-card {
        padding: 25px 18px;
    }

    .forgot-card h1 {
        font-size: 22px;
    }
}
</style>
{% endblock %}
{% block content %}

<div class="forgot-container">
    <div class="forgot-card">    <h1>Forgot Password?</h1>

    <p>
        {% if new %}
            Create a new password for your account.
        {% else %}
            Enter your username to reset your password.
        {% endif %}
    </p>

    <form action="" method="post">
        {% csrf_token %}

        {% if new %}

            <div class="forgot-field">
                <label>Username</label>
                <input type="text"
                       value="{{ old.username }}"
                       disabled>
            </div>

            <div class="forgot-field">
                <label>Enter New Password</label>
                <input type="password"
                       name="npasw"
                       placeholder="Enter new password"
                       required>
            </div>

            <div class="forgot-field">
                <label>Confirm New Password</label>
                <input type="password"
                       name="cnpasw"
                       placeholder="Confirm new password"
                       required>
            </div>

        {% else %}

            <div class="forgot-field">
                <label>Username</label>
                <input type="text"
                       name="uname"
                       placeholder="Enter your username"
                       required>
            </div>

        {% endif %}

        <button type="submit">SUBMIT</button>
    </form>

    <a href="{% url 'login_' %}" class="forgot-login">
        Back to Login
    </a>

</div>

</div>{% endblock %}
