{% extends 'main.html' %}

{% block css %}
<style>
    .login-container {
    min-height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-card {
    width: 100%;
    max-width: 400px;
    padding: 35px;
    background: rgba(8, 13, 28, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(250, 204, 21, 0.4);
    border-radius: 18px;
    box-sizing: border-box;
}

.login-card h1 {
    color: #facc15;
    text-align: center;
}

.login-card p {
    color: white;
    text-align: center;
    margin-bottom: 30px;
}

.login-field {
    margin-bottom: 20px;
}

.login-field label {
    display: block;
    color: white;
    margin-bottom: 8px;
}

.login-field input {
    width: 100%;
    padding: 12px;
    background: #101a30;
    border: 1px solid #475569;
    border-radius: 8px;
    color: white;
    box-sizing: border-box;
}

.login-card button {
    width: 100%;
    padding: 13px;
    background: #facc15;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.login-options {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 22px;
}

.login-options a {
    color: #facc15;
    text-decoration: none;
    font-size: 13px;
}

@media(max-width: 480px) {
    .login-card {
        padding: 25px 18px;
    }
}
</style>
{% endblock %}

{% block content %}

<div class="login-container"><div class="login-card">

    <h1>Welcome Back</h1>
    <p>Continue exploring the universe.</p>

    <form action="" method="post">
        {% csrf_token %}

        <div class="login-field">
            <label>Username</label>
            <input type="text" name="uname" required>
        </div>

        <div class="login-field">
            <label>Password</label>
            <input type="password" name="pasw" required>
        </div>

        <button type="submit">LOGIN</button>
    </form>

    <div class="login-options">
        <a href="{% url 'register' %}">Create Account</a>
        <a href="{% url 'forget_password' %}">Forgot Password?</a>
    </div>

</div>

</div>{% endblock %}
