{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Explorer</title>
    <style>
        .navbar {
            width: 100%;
            min-height: 70px;
            background: #101a30;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            border-bottom: 1px solid #263650;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
        }

        .nav-logo {
            color: #facc15;
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: #e5e7eb;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #facc15;
        }

        @media screen and (max-width: 768px) {

            .navbar {
                flex-direction: column;
                padding: 18px 12px;
                gap: 18px;
            }

            .nav-logo {
                font-size: 21px;
            }

            .nav-links {
                justify-content: center;
                flex-wrap: wrap;
                gap: 15px;
            }

            .nav-links a {
                font-size: 13px;
            }
        }
        body{
            margin: 0;
            min-height: 100vh;
            background-image: linear-gradient(rgba(3, 8, 25, 0.45), rgba(3, 8, 25, 0.45)),url("{% static 'images/spaceproject.jpeg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>

    {% block css %}
    {% endblock %}
</head>
<body>
    {% include 'nav.html' %}
    <center>
        {% if messages %}
            {% for i in messages %}
                <p style="color: red;">{{i}}</p>
            {% endfor %}
        {% endif %}
    </center>
    {% block content %}
    {% endblock %} 
</body>
</html>
